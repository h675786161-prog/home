<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#f8f5fb">
<title>懒人英语语言包</title>
<style>
html,body{margin:0;min-height:100%;background:#f8f5fb;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#594f61}
body{display:grid;place-items:center}
#status{font-size:13px;padding:24px;text-align:center;line-height:1.7}
</style>
</head>
<body>
<div id="status">正在连接英语站…</div>
<script>
(async()=>{
  'use strict';
  const API='https://ibpffxzdjvgydnhmvmvc.supabase.co/functions/v1/english-private-api';
  const ASSET='https://ibpffxzdjvgydnhmvmvc.supabase.co/functions/v1/english';
  const status=document.getElementById('status');
  try{
    const response=await fetch(API+'?front=v2&t='+Date.now(),{cache:'no-store',headers:{accept:'application/json'}});
    if(!response.ok)throw new Error('主站接口 '+response.status);
    const data=await response.json();
    if(typeof data?.html!=='string')throw new Error('主站没有返回 HTML');
    let html=data.html;
    html=html.replace('<link rel="manifest" href="./manifest.json">','');
    html=html.replace("if('serviceWorker' in navigator&&location.hostname!=='raw.githack.com') navigator.serviceWorker.register('./sw.js').catch(()=>{});","/* front-v2: service worker disabled */");
    const stamp=Date.now();
    const extras=[
      '<scr'+'ipt>window.__englishFrontDoor="front-v2-public";</scr'+'ipt>',
      '<scr'+'ipt src="'+ASSET+'?asset=full&front=v2&t='+stamp+'"></scr'+'ipt>',
      '<scr'+'ipt src="'+ASSET+'?asset=smart&front=v2&t='+stamp+'"></scr'+'ipt>',
      '<scr'+'ipt src="'+ASSET+'?asset=coach&front=v2&t='+stamp+'"></scr'+'ipt>'
    ].join('');
    html=html.replace('</body>',extras+'</body>');
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    status.innerHTML='载入失败：'+String(error?.message||error)+'<br>刷新后会自动重试。';
  }
})();
</script>
</body>
</html>
