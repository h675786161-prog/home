<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#f6efff">
<title>loading…</title>
<style>
html,body{margin:0;min-height:100%;background:#f8f5fb;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#594f61}
body{display:grid;place-items:center}
#s{font-size:13px;padding:18px}
</style>
</head>
<body>
<div id="s">正在载入…</div>
<script>
const API='https://ibpffxzdjvgydnhmvmvc.supabase.co/functions/v1/english-private-api';
(async()=>{
  try{
    const r=await fetch(API,{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const data=await r.json();
    if(!data.html)throw new Error('empty html');
    document.open();
    document.write(data.html);
    document.close();
  }catch(e){
    document.getElementById('s').textContent='载入失败：'+(e.message||e);
  }
})();
</script>
</body>
</html>
