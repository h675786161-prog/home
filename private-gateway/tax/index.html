<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>玲的三税学习站</title>
  <style>
    :root{--bg:#f7f3fa;--panel:#fff;--line:#e5ddea;--text:#3d3447;--muted:#776c80;--accent:#806292;--danger:#9d3654}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
    body{min-height:100dvh;display:grid;place-items:center;padding:24px}.card{width:min(100%,400px);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 12px 50px #66507712}
    .badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#f2ecf5;color:#765f7f;font-size:12px;margin-bottom:10px}h1{font-size:24px;margin:0 0 8px}p{font-size:14px;line-height:1.7;color:var(--muted)}
    input,button{width:100%;font:inherit;padding:14px;border-radius:12px;margin-top:12px}input{border:1px solid #dcd1e4;background:#fff;outline:none}input:focus{border-color:#aa8aba;box-shadow:0 0 0 3px #80629214}
    button{border:0;background:var(--accent);color:#fff;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.msg{min-height:24px;font-size:13px;margin-top:10px;color:var(--muted)}.msg.err{color:var(--danger)}.tiny{font-size:11px;color:#948a91;line-height:1.65;margin-top:13px}
  </style>
</head>
<body>
  <main class="card" id="shell">
    <div class="badge">🔒 私有入口</div>
    <h1>私人站点</h1>
    <p>输入玲给你的访问码。登录后，这台设备会记住 30 天。</p>
    <form id="siteGate">
      <input id="siteCode" type="password" autocomplete="current-password" placeholder="访问码" required maxlength="120">
      <button id="siteEnter" type="submit">进入</button>
    </form>
    <div id="siteMsg" class="msg">正在检查登录…</div>
  </main>
<script>
const SITE_ACCESS='https://ibpffxzdjvgydnhmvmvc.supabase.co/functions/v1/site-access';
const TAX_AUTH='https://ibpffxzdjvgydnhmvmvc.supabase.co/functions/v1/tax-private-api';
const TAX_SITE='https://ibpffxzdjvgydnhmvmvc.supabase.co/functions/v1/tax-site-content';
const SITE_TOKEN_KEY='privateSitesSession';
const TAX_TOKEN_KEY='ling_tax_private_token_v1';
const COACH_SCRIPT='./coach-session-ui.js?v=20261005a';

async function jsonPost(url,body,timeout=15000){
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:AbortSignal.timeout(timeout)});
  let data={};try{data=await r.json()}catch{}
  if(!r.ok){
    const e=new Error(r.status===401?'访问码不对或登录已过期':(data.error||('载入失败：'+r.status)));
    e.status=r.status;throw e;
  }
  return data;
}
function setMsg(id,text,err=false){const el=document.getElementById(id);if(!el)return;el.textContent=text||'';el.className='msg'+(err?' err':'')}
function injectCoach(html){
  if(!html||html.includes('taxCoachSessionUI'))return html;
  const tag='<script src="'+COACH_SCRIPT+'"><\/script>';
  return /<\/body>/i.test(html)?html.replace(/<\/body>/i,tag+'</body>'):html+tag;
}
async function openTaxSite(token){
  const data=await jsonPost(TAX_SITE,{token});
  if(!data.html)throw new Error('没有拿到题本内容');
  const html=injectCoach(data.html);
  document.open();document.write(html);document.close();
}
function mountTaxGate(){
  document.getElementById('shell').innerHTML=`
    <div class="badge">🔒 税务师学习站</div>
    <h1>玲的三税学习站</h1>
    <p>题本正文不会放进公开仓库。验证通过后才从私有接口载入。</p>
    <form id="taxGate">
      <input id="taxCode" type="password" autocomplete="current-password" placeholder="税务站访问码" required autofocus>
      <button id="taxEnter" type="submit">进入题本</button>
    </form>
    <div id="taxMsg" class="msg"></div>
    <div class="tiny">登录成功后只保存 30 天会话令牌，不保存原始访问码。</div>`;
  const form=document.getElementById('taxGate'),btn=document.getElementById('taxEnter');
  async function load(payload){
    btn.disabled=true;setMsg('taxMsg','正在验证并载入题本…');
    try{
      let token=payload.token||'';
      if(!token&&payload.access_code){
        const auth=await jsonPost(TAX_AUTH,{access_code:payload.access_code});
        token=auth.token||'';
        if(!token)throw new Error('登录成功但没有拿到会话令牌');
        localStorage.setItem(TAX_TOKEN_KEY,token);
      }
      await openTaxSite(token);
    }catch(e){
      if(payload.token||e.status===401)localStorage.removeItem(TAX_TOKEN_KEY);
      setMsg('taxMsg',e.name==='TimeoutError'?'连接超时，请再试一次':(e.message||'载入失败'),true);btn.disabled=false;
    }
  }
  form.addEventListener('submit',e=>{e.preventDefault();const code=document.getElementById('taxCode').value;if(code)load({access_code:code})});
  const saved=localStorage.getItem(TAX_TOKEN_KEY);if(saved)load({token:saved});
}
async function enterOuter(token){
  localStorage.setItem(SITE_TOKEN_KEY,token);
  mountTaxGate();
}
const outerForm=document.getElementById('siteGate'),outerBtn=document.getElementById('siteEnter');
outerForm.addEventListener('submit',async e=>{
  e.preventDefault();outerBtn.disabled=true;setMsg('siteMsg','正在登录…');
  try{
    const d=await jsonPost(SITE_ACCESS,{action:'login',code:document.getElementById('siteCode').value});
    if(!d.token)throw new Error('登录成功但没有拿到会话令牌');
    enterOuter(d.token);
  }catch(e){setMsg('siteMsg',e.name==='TimeoutError'?'连接超时，请再试一次':e.message,true);outerBtn.disabled=false}
});
(async()=>{
  const token=localStorage.getItem(SITE_TOKEN_KEY);
  if(!token){setMsg('siteMsg','');return}
  try{await jsonPost(SITE_ACCESS,{action:'verify',token});enterOuter(token)}
  catch(e){if(String(e.message).includes('过期')||e.status===401)localStorage.removeItem(SITE_TOKEN_KEY);setMsg('siteMsg','请重新输入访问码，或检查网络后刷新。',true)}
})();
</script>
</body>
</html>
