name: Vendor Codex skills

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/vendor-codex-skills.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vendor pinned skills into repository
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            .agents/skills/web-design-guidelines \
            .agents/skills/design-taste-frontend \
            .agents/skills/image-to-code

          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/vercel-labs/agent-skills/063bee94c3f4df8453406c830b0a7df0f2860278/skills/web-design-guidelines/SKILL.md \
            --output .agents/skills/web-design-guidelines/SKILL.md

          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/Leonxlnx/taste-skill/ccbc15639c97057cbfcf32ecebc38ef716e4bb37/skills/taste-skill/SKILL.md \
            --output .agents/skills/design-taste-frontend/SKILL.md

          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/Leonxlnx/taste-skill/ccbc15639c97057cbfcf32ecebc38ef716e4bb37/skills/image-to-code-skill/SKILL.md \
            --output .agents/skills/image-to-code/SKILL.md

          grep -q '^name: web-design-guidelines$' .agents/skills/web-design-guidelines/SKILL.md
          grep -q '^name: design-taste-frontend$' .agents/skills/design-taste-frontend/SKILL.md
          grep -q '^name: image-to-code$' .agents/skills/image-to-code/SKILL.md

      - name: Commit vendored skills
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents/skills
          if git diff --cached --quiet; then
            echo "Skills are already up to date."
            exit 0
          fi
          git commit -m "chore: vendor Codex frontend skills"
          git push
