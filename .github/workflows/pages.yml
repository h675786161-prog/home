name: Deploy Home static mirror

on:
  push:
    branches: [main]
    paths:
      - 'private-gateway/**'
      - 'index.html'
      - 'app.js'
      - 'style.css'
      - 'styles.css'
      - 'manifest.webmanifest'
      - 'sw.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated English mirror
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('private-gateway/e7')
          manifest=json.loads((root/'mirror.json').read_text())
          for name,expected in manifest['files'].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==expected, name
          PY
      - name: Prepare static site
        run: |
          mkdir -p public
          cp index.html app.js icon.svg manifest.webmanifest sw.js public/
          for css in style.css styles.css; do test ! -f "$css" || cp "$css" public/; done
          cp -r private-gateway public/
          mkdir -p public/english
          printf '%s\n' '<!doctype html><meta charset="utf-8"><a href="../private-gateway/e7/front-v2.html">英语学习</a><script>location.replace("../private-gateway/e7/front-v2.html")</script>' > public/english/index.html
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
