on>\n\n      \u003csection id=\"notes\" class=\"view\" data-view=\"notes\">\n        \u003cdiv class=\"section-title\">\u003cdiv>\u003cp class=\"eyebrow\">MEMORY\u003c/p>\u003ch2>生活记录\u003c/h2>\u003c/div>\u003cbutton class=\"primary-btn\" data-open=\"note\">记一条\u003c/button>\u003c/div>\n        \u003cdiv id=\"noteList\" class=\"masonry\">\u003c/div>\n      \u003c/section>\n\n      \u003csection id=\"projects\" class=\"view\" data-view=\"projects\">\n        \u003cdiv class=\"section-title\">\u003cdiv>\u003cp class=\"eyebrow\">PROJECTS\u003c/p>\u003ch2>一起推进\u003c/h2>\u003c/div>\u003cbutton class=\"primary-btn\" data-open=\"project\">新建项目\u003c/button>\u003c/div>\n        \u003cdiv id=\"projectList\" class=\"project-grid\">\u003c/div>\n      \u003c/section>\n\n      \u003csection id=\"settings\" class=\"view\" data-view=\"settings\">\n        \u003cdiv class=\"section-title\">\u003cdiv>\u003cp class=\"eyebrow\">SYNC\u003c/p>\u003ch2>连接共享数据\u003c/h2>\u003c/div>\u003c/div>\n        \u003csection class=\"card settings-card\">\n          \u003cp>不填任何东西也能用，数据会保存在当前浏览器。填好共享 API 后，前端和 MCP 就能读写同一份数据。\u003c/p>\n          \u003clabel>API 地址 \u003cinput id=\"apiUrl\" placeholder=\"https://your-worker.workers.dev\" />\u003c/label>\n          \u003clabel>访问令牌 \u003cinput id=\"apiToken\" type=\"password\" placeholder=\"只保存在这个浏览器\" />\u003c/label>\n          \u003cdiv class=\"button-row\">\n            \u003cbutton id=\"saveSync\" class=\"primary-btn\">保存连接\u003c/button>\n            \u003cbutton id=\"pullSync\" class=\"ghost-btn\">从云端拉取\u003c/button>\n            \u003cbutton id=\"pushSync\" class=\"ghost-btn\">推送到云端\u003c/button>\n          \u003c/div>\n          \u003cp id=\"syncMessage\" class=\"muted\">\u003c/p>\n        \u003c/section>\n        \u003csection class=\"card settings-card\">\n          \u003ch3>数据备份\u003c/h3>\n          \u003cdiv class=\"button-row\">\n            \u003cbutton id=\"exportData\" class=\"ghost-btn\">导出 JSON\u003c/button>\n            \u003clabel cla
